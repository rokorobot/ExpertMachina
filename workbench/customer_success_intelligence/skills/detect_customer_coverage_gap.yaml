skill_id: detect_customer_coverage_gap
workbench: customer_success_intelligence
status: ACTIVE
boundary_tags: [now]
base_pattern: coverage-gap (refusal-backed)
consolidates:
  # the v2.4 consolidation ruling (WS0 ruling 2): four registry #6
  # drafts are all "a documented promise/obligation exists but no
  # approved coverage exists" questions - ONE contract with declared
  # coverage classes preserves each draft's meaning.
  - detect_missing_customer_success_playbooks
  - identify_unbacked_promised_outcomes
  - detect_missing_qbr_reporting_procedure
  - detect_missing_service_commitment_evidence
purpose: >
  Detect where a documented customer promise or obligation has NO
  approved covering material: a promised quarterly business review
  with no QBR procedure, a promised outcome with no delivery process,
  a service commitment with no covering evidence, an obligation with
  no playbook. Absence is a FINDING, never a fact - the gap is backed
  by the governed corpus's refusal to produce covering evidence
  (REFUSAL_BACKED). It states what coverage is MISSING - it NEVER
  states that the customer is affected, dissatisfied, or at risk
  because of it (THE IMPUTED HEALTH, refused).
coverage_convention:
  coverage_classes: [qbr_procedure, playbook, escalation,
                     delivery_process, service_commitment_evidence]
  # the declared obligation markers this skill reads from governed
  # customer-facing promises/obligations; a marker firing on a
  # promise/obligation triggers the coverage question for its class
  obligation_markers:
    qbr_procedure: ["quarterly business review"]
    playbook: ["playbook"]
    escalation: ["escalation"]
    delivery_process: ["success manager", "onboarding"]
    service_commitment_evidence: ["availability target", "service level"]
  coverage_rule: >
    for each declared class whose obligation marker fires on an
    approved promise/obligation fact, covering material is an
    approved PROCEDURE-class fact (or covering document) whose
    content addresses the class's subject; the gap finding exists
    ONLY when the governed corpus offers no covering material - the
    refusal IS the evidence (the v1.6 coverage-gap lineage,
    unchanged). A covered obligation is SILENCE, never a finding.
allowed_inputs:
  - the compiled expert package at binding clearance (approved
    promise, obligation, procedure, and playbook statements, PRIMARY
    or DERIVED, cited by asset id)
  - MCP get_domain_subgraph at the AGENT token's clearance
forbidden_inputs:
  - ungoverned sources; candidate/held content
  - usage/activity records, CRM exports, tickets, NPS, health-score
    tables as data, relationship-state metrics - every operational
    customer record (until [OE])
  - any inference from the gap to the relationship's state ("the
    customer is therefore at risk") - THE IMPUTED HEALTH
  - any assertion that the promise was or was not DELIVERED (the
    completion question is [OE])
  - wall-clock time (declared parameters only)
  - other skills' pending (ungated) findings
evidence_rules: >
  A CUSTOMER_COVERAGE_GAP finding requires the verbatim
  promise/obligation excerpt (asset id + quote), the declared
  coverage class, and the declared coverage question the governed
  corpus could not answer. Absence is declared as absence-of-approved-
  coverage at the declared run, never as a fact about the world.
  evidence_basis: REFUSAL_BACKED.
forbidden_vocabulary:
  - "is healthy"
  - "churn risk"
  - "likely to churn"
  - "at risk of churn"
  - "customer is satisfied"
  - "health score"
allowed_finding_kinds: [CUSTOMER_COVERAGE_GAP]
output_format: >
  One proposal document per finding to /08_proposals with the D30 +
  catalog frontmatter claims (workbench, skill, skill_version,
  finding_kind, evidence_basis); body = the declared customer scope,
  the promise/obligation excerpt (asset id + verbatim quote), the
  coverage class, the coverage question asked and refused, proposed
  action (create/approve the covering procedure through governed
  authoring - the workbench never writes the playbook).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - the obligation is implied rather than explicit -> NEEDS_REVIEW,
    never guessed into a gap
  - covering material exists -> SILENCE (the covered case never
    becomes a finding)
  - "is the customer harmed/at risk because of this gap?" -> refuse,
    naming [OE] (THE IMPUTED HEALTH)
question_frames:
  - "Which documented customer promises or obligations have no approved playbook, QBR procedure, or delivery process?"
  - "Which service commitments to this customer lack approved covering material?"
