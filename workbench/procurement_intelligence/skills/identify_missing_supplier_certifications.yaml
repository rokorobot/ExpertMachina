skill_id: identify_missing_supplier_certifications
workbench: procurement_intelligence
status: ACTIVE
boundary_tags: [now]
base_pattern: missing-evidence
purpose: >
  Detect suppliers for whom the governed corpus documents a
  certification requirement but cannot produce the approved covering
  certificate. Absence becomes a finding, never a fact - and the
  finding says the DOCUMENTS do not evidence the certification, never
  that the supplier is uncertified in the world. Inherits the v1.7
  missing-evidence pattern wholesale.
requirement_convention:
  # the declared policy trigger + the per-supplier evidence question.
  # Refusal-first cuts both ways: a supplier whose question the corpus
  # answers produces NO finding (the covered control).
  requirement_trigger: "must hold a current ISO 27001 certificate"
  scope_trigger: "processes customer data"
  question_template: "Which approved document holds the current ISO
    27001 certificate for {supplier}?"
allowed_inputs:
  - the compiled expert package at binding clearance (the policy
    requirement, supplier scope statements, and any certificates)
  - the declared per-supplier evidence questions, run through package
    consume() under the packaged answering contract
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - operational verification of certification status ([OE] territory)
  - other skills' pending (ungated) findings
evidence_rules: >
  A finding requires: the requirement excerpt (asset id + verbatim
  quote), the supplier's in-scope excerpt (verbatim), AND the
  reproducible INSUFFICIENT EVIDENCE refusal for the declared question.
  SUPPLIER-NAMED COVERAGE: a covering answer must NAME the supplier -
  an answer excerpt that does not contain the supplier's name does not
  cover that supplier's question (another supplier's certificate is
  never evidence). A supplier whose question the corpus answers with
  supplier-named evidence produces NO finding.
  evidence_basis: REFUSAL_BACKED with the requirement excerpt cited.
allowed_finding_kinds: [MISSING_SUPPLIER_CERTIFICATION]
output_format: >
  One proposal document per finding to /08_proposals with the D30 +
  catalog frontmatter claims; body = the requirement (excerpt +
  source), the supplier scope excerpt, the refused question, proposed
  action (obtain or ingest the certificate through the governed
  pipeline - the finding never asserts the certificate does not exist
  in the world).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - the requirement or scope statement is implied rather than explicit
    -> NEEDS_REVIEW
  - the corpus answers the question (a covered control - no gap)
  - operational certification verification is requested -> refuse; the
    Operational Evidence Realm decision is not minted
