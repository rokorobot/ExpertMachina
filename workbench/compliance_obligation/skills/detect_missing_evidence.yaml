skill_id: detect_missing_evidence
workbench: compliance_obligation
status: ACTIVE
boundary_tags: [now]
base_pattern: missing-evidence
consolidates:
  # the v1.7 consolidation ruling (WS0 gate): the evidence-gap
  # variants become ONE contract with declared requirement classes.
  - detect_sla_evidence_gaps
  - detect_reporting_obligation_gaps
  - detect_notification_obligation_gaps
purpose: >
  Detect documented requirements whose approved covering evidence the
  governed corpus cannot produce. Absence becomes a finding, never a
  fact - and the finding says the DOCUMENTS do not evidence the
  requirement, never that the company does not fulfill it.
requirement_classes:
  # each class = a declared trigger (the requirement excerpt the
  # class rests on) + the evidence question asked through consume().
  # Refusal-first cuts both ways: a class whose question the corpus
  # answers produces NO finding (the covered control).
  - class: training_completion
    trigger: "completion summary for each training cycle"
    question: "Which approved record shows the completed security
      awareness training summary for the latest cycle?"
  - class: incident_response_testing
    trigger: "incident response plan must be tested"
    question: "Was the annual incident response plan test completed
      and the test report retained for audit review?"
composition_across_the_valve: >
  Registry rule 6, executed here (the v1.7 COMPOSITION PROOF): this
  skill may additionally consume ACCEPTED obligation facts (DERIVED,
  produced by extract_compliance_obligations and accepted by a human)
  as requirement sources - NEVER pending proposals. A finding built
  on a DERIVED requirement cites its evidence as DERIVED, so
  second-generation synthesis stays visible at the gate (D30
  derivation depth).
allowed_inputs:
  - the compiled expert package at binding clearance (the requirement
    excerpts and any covering evidence)
  - the declared evidence questions, run through package consume()
    under the packaged answering contract
  - ACCEPTED obligation facts (DERIVED) as requirement sources -
    never pending proposals
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - operational records as evidence of fulfillment (that is [OE]
    territory - this skill reads documents only)
  - other skills' pending (ungated) findings
  - rendered vault notes as authority
evidence_rules: >
  A finding requires: the requirement's source excerpt (asset id +
  verbatim quote; a DERIVED requirement cited as DERIVED) AND the
  reproducible INSUFFICIENT EVIDENCE refusal for the declared
  evidence question. Absence becomes a finding, never a fact. A
  requirement whose question the corpus answers produces NO finding.
  evidence_basis: REFUSAL_BACKED with the requirement excerpt cited.
allowed_finding_kinds: [MISSING_COMPLIANCE_EVIDENCE]
output_format: >
  One proposal document per finding to /08_proposals with the D30 +
  catalog frontmatter claims; body = the requirement (excerpt +
  source, DERIVED flagged when applicable), the refused evidence
  question, proposed action (produce or ingest the evidence document;
  the finding never asserts the evidence does not exist in the world
  - only that the governed corpus does not hold it).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - the requirement is implied rather than explicit -> NEEDS_REVIEW
  - the corpus answers the evidence question (a covered control - no
    gap exists)
  - fulfillment verification against operational records is requested
    -> refuse; the Operational Evidence Realm decision is not minted
