skill_id: detect_price_increase_clauses
workbench: procurement_intelligence
status: ACTIVE
boundary_tags: [now]
base_pattern: extract-candidates (numeric clause axis)
purpose: >
  Detect price-adjustment clauses in governed vendor contracts. The
  finding quotes the clause verbatim; an explicit percentage or amount
  is cited verbatim; a paraphrased quantity ("one fifth") is quoted AS
  TEXT and flagged non-numeric - it is never converted, computed, or
  normalized (THE INVENTED NUMBER posture).
increase_markers:
  # a sentence is a price-adjustment candidate ONLY when it carries an
  # explicit adjustment marker
  - "increases by"
  - "increase of"
  - "price adjustment"
  - "uplift"
  - "adjusted upward"
numeric_rule: >
  A percentage token matching (\d+(\.\d+)?\s?%) or an explicit amount
  inside the clause is cited VERBATIM as part of the excerpt. A clause
  matching an increase marker with NO numeric token is a finding with
  non_numeric: true - the quantity phrase quoted as text, never
  converted to a number. Conversion, rounding, normalization, and
  estimation are refused at the source.
allowed_inputs:
  - the compiled expert package at binding clearance
  - MCP get_domain_subgraph(procurement) at the AGENT token's clearance
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - market rates, benchmarks, spend data, or any external figure
  - other skills' pending (ungated) findings
evidence_rules: >
  A finding requires the verbatim clause excerpt (asset id + quote)
  matching a declared increase marker. Every digit in the finding is
  inside the verbatim excerpt; the finding adds NO numeric value of its
  own. evidence_basis: EXCERPT_BACKED.
allowed_finding_kinds: [PRICE_INCREASE_CLAUSE]
output_format: >
  One proposal document per clause to /08_proposals with the D30 +
  catalog frontmatter claims; body = the verbatim clause, the source
  asset id, the non_numeric flag where applicable, proposed action
  (review the clause before renewal through the human workflow - never
  a renegotiation demand, never a savings estimate).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - a paraphrased quantity would need conversion to state a number ->
    quote it as text with non_numeric: true, never convert
  - the clause cannot be cited verbatim -> refuse to emit
  - a savings/spend/market estimate is requested -> refuse (the
    cardinal sin)
