skill_id: identify_outdated_policies
workbench: compliance_obligation
status: ACTIVE
boundary_tags: [now]
base_pattern: outdated-guidance
purpose: >
  Identify governed policies that are superseded, track a superseded
  revision, or are overdue by their OWN declared review interval.
  Never age alone: a document is outdated only when governed revision
  evidence or its own declared review discipline says so.
review_interval_convention:
  # the declared marker this skill reads from governed content - a
  # single sentence carrying both the interval and the last review:
  #   "must be reviewed every N months, and its last completed
  #    review was dated YYYY-MM-DD"
  marker_pattern: "must be reviewed every (\\d+) months, and its last
    completed review was dated (\\d{4}-\\d{2}-\\d{2})"
  overdue_rule: >
    overdue if and only if (last_review_date + declared_interval) is
    strictly before the declared as_of date. The as_of date is a
    DECLARED run parameter, recorded verbatim in every finding -
    never wall-clock (byte-identical re-runs hold at a pinned as_of).
allowed_inputs:
  - the compiled expert package at binding clearance (declared
    review-interval statements inside governed documents)
  - MCP get_revision_history chains for assets in scope
  - governed conflicts and their supersession classifications
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - document age as evidence (age alone proves nothing)
  - wall-clock time (as_of is declared, never sampled)
  - other skills' pending (ungated) findings
evidence_rules: >
  A finding requires revision-chain evidence (a supersession
  classification, or guidance aligned with a superseded revision
  while a newer approved revision exists) OR the document's OWN
  declared review interval overdue at the declared as_of (the
  review_interval_convention above, quoted verbatim). Never age
  alone. A policy whose declared review is current at as_of produces
  NO finding. evidence_basis: REVISION_BACKED.
allowed_finding_kinds: [OUTDATED_POLICY]
output_format: >
  One proposal document per finding to /08_proposals with the D30 +
  catalog frontmatter claims; body = the policy (asset id + the
  verbatim review-interval excerpt or revision evidence), the
  declared as_of, the computed due date, proposed action (schedule
  the review or supersede the policy - stated as documentation
  status, never as a conduct judgment).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - recency cannot be established from governed revision,
    supersession, or self-declared review-interval evidence
  - the declared review is current at as_of (no finding)
  - no as_of declared for the run -> refuse (never sample the clock)
