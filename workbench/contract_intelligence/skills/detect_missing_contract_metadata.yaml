skill_id: detect_missing_contract_metadata
workbench: contract_intelligence
status: ACTIVE
boundary_tags: [now]
base_pattern: missing-evidence (contract-metadata axis)
purpose: >
  Declare, per contract document, which REQUIRED metadata classes have
  no detectable clause - absence declared honestly, never guessed, and
  never a fact about the world (a contract may hold the clause in
  language the pinned rules cannot see; the gap says "not detectable
  under the ratified rules", which is itself commercially useful).
  Absence becomes a finding, never a fact.
required_metadata:
  # the declared REQUIRED set (v2.1 WS0 ruling 1): a contract document
  # missing ALL classes in a group below produces one gap finding
  # naming the group. Ruled minimal deliberately - the register's
  # required floor, not a completeness fantasy.
  - group: term_boundary
    any_of: [renewal, termination, effective_date, expiry_date]
  - group: payment
    any_of: [payment]
allowed_inputs:
  - the compiled expert package at binding clearance (approved
    contract document content, per the engine's
    contract_document_rule)
  - the pinned clause_class taxonomy and marker regimes of
    extract_contract_clauses (the ONE extraction contract - this
    detector reuses its rules, never invents its own)
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - other skills' pending (ungated) findings
  - rendered vault notes as authority (D31)
evidence_rules: >
  A gap finding names the contract document verbatim by title, the
  missing group, and the classes probed; it cites the contract
  document's asset ids as the SEARCHED evidence (what was looked at,
  honestly), and states that detection ran under the pinned taxonomy -
  never that the clause does not exist. evidence_basis:
  ABSENCE_DECLARED (the missing-evidence lineage, v1.7).
allowed_finding_kinds: [CONTRACT_METADATA_GAP]
output_format: >
  One proposal document per (contract, missing group) to
  /08_proposals with the D30 + catalog frontmatter claims. Proposed
  action: locate or author the clause through the governed pipeline;
  on acceptance the register gains the entry and the gap closes.
human_approval_requirement: >
  The valve (D29): every gap is a held CANDIDATE until a human accepts
  it as a DERIVED fact; no policy tier ever applies.
audit_event: >
  MCP calls audited; scan/hold/gate events are the ledger trail;
  approval quotes verified provenance verbatim.
refusal_conditions:
  - a contract whose required groups are all detectably present (a
    covered control - no gap entry; refusal-first cuts both ways)
  - a document outside the contract_document_rule
  - a run without a declared as_of
