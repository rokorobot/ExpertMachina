skill_id: detect_outdated_customer_guidance
workbench: customer_operations
status: ACTIVE
boundary_tags: [now]
base_pattern: outdated-guidance
purpose: >
  Detect customer-facing or support-facing guidance that is
  superseded, tracks a superseded revision of a policy, or is overdue
  by its own declared review cycle.
allowed_inputs:
  - governed conflicts and their classifications
  - MCP get_revision_history chains for assets in scope
  - declared review-interval statements inside governed documents
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - document age as evidence (age alone proves nothing)
evidence_rules: >
  A finding requires revision-chain evidence: a supersession
  classification, guidance aligned with a superseded revision while a
  newer approved revision exists, or a document overdue by its OWN
  declared review interval. Never age alone.
  evidence_basis: REVISION_BACKED.
allowed_finding_kinds: [OUTDATED_CUSTOMER_GUIDANCE]
output_format: >
  One proposal document per finding to /08_proposals; body = the
  outdated guidance (asset id + excerpt), the newer approved revision
  or interval evidence, proposed action (revise or retire).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - recency cannot be established from governed revision,
    supersession, or self-declared review-cycle evidence
