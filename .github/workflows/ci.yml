# CI (audit M0.1): the machine-enforced arm of the regression contract.
#
# Suite discovery replaced hand-enumeration on 2026-07-07 (audit finding
# H-TEST-1, docs/audit-2026-07-07.md): the old per-suite list had silently
# orphaned 18 of 64 suites. The harness (backend/harness/test_suites.py)
# now runs EVERY backend/test_*.py as an isolated subprocess - a new suite
# is in CI the moment the file exists; keeping one out requires an
# explicit, commented NOT_SUITES entry in the harness, never a forgotten
# YAML line. Model-dependent verification (the ~1GB NLI cross-encoder)
# runs in keyword-fallback mode here (EM_NLI_VERIFICATION=off); the
# full-model runs live in nightly-nli.yml (audit task T0.3, cached model).
#
# The named guard steps below are deliberately NOT folded into the
# harness sweep (which runs them too): each is a permanent, constitutional
# invariant (D18/D24/D25/D26/D28/D29-D30/D31), and its named presence in
# this file is part of the record. The duplicate execution is cheap; the
# visibility is not.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      EM_NLI_VERIFICATION: "off"
      OPENAI_API_KEY: "mock-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Dependency custody (audit T2.2, H-DEP-1): the LOCK is what installs -
      # the full transitive tree, hash-verified. requirements.txt stays the
      # human-readable manifest; editing it without regenerating the lock
      # fails here. Regenerate with:
      #   uv pip compile requirements.txt --universal --generate-hashes \
      #       --python-version 3.11 -o requirements.lock
      - name: Install backend dependencies (locked, hash-verified)
        run: pip install --require-hashes -r backend/requirements.lock
      # The audit gate: every push is scanned against the advisory DBs.
      # Accepted findings are listed HERE, each with a reason and a
      # review-by date - never silent, never open-ended (T2.2 rule).
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --disable-pip \
            --ignore-vuln CVE-2025-5472 \
            --ignore-vuln CVE-2025-5302 \
            --ignore-vuln CVE-2025-7647 \
            --ignore-vuln CVE-2025-6208 \
            --ignore-vuln CVE-2024-12704 \
            --ignore-vuln PYSEC-2026-597 \
            --ignore-vuln CVE-2025-3000
          # Accepted findings (review by 2026-08-31 or at the next release):
          # - llama-index-core 0.10.44 (5 CVEs): fixes require 0.12/0.13, a
          #   major framework jump the ingestion pipeline depends on - NOT a
          #   low-risk bump. Follow-up: audit task T2.6 (upgrade or shed).
          # - nltk 3.9.4 (PYSEC-2026-597): transitive via llama-index; no
          #   fixed release exists yet - nothing to upgrade to.
          # - torch 2.12.0 (CVE-2025-3000): no fixed release listed; NLI-only
          #   dependency - exposure shrinks at T2.5 (optional requirements-nli).
      - name: All suites (auto-discovered harness - every backend/test_*.py)
        working-directory: backend
        run: python -m pytest -q
      - name: Architectural seam suite (D18 boundary)
        working-directory: backend
        run: python test_connector_seam.py
      - name: Workbench projection guard (D24 schema snapshot)
        working-directory: backend
        run: python test_workbench_projection.py
      - name: Credential custody guard (D25 sentinel sweep)
        working-directory: backend
        run: python test_credential_custody.py
      - name: Ingestion automation guard (D26 single approval path + revision sentinel)
        working-directory: backend
        run: python test_ingestion_automation_guard.py
      - name: Projection guard (D28 lens rule - no governed writes, renders never inputs)
        working-directory: backend
        run: python test_projection_guard.py
      - name: Agent authorship guard (D29/D30 one-way valve + derived source class)
        working-directory: backend
        run: python test_agent_authorship_guard.py
      - name: Render-ingress guard (D31 - render authority dies at ingress)
        working-directory: backend
        run: python test_render_ingress_guard.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The lockfile is generated by npm 11 (local dev). npm 10 (bundled
      # with Node 20) validates bundled deps of wasm optional packages
      # (@emnapi/* under tailwind oxide) differently and rejects the lock.
      # Pin CI to the npm major that owns the lockfile.
      - name: Align npm with the lockfile generator
        run: npm install -g npm@11
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint (errors fail; warnings reported)
        working-directory: frontend
        run: npx eslint src
