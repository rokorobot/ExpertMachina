skill_id: detect_sla_obligation_gap
workbench: customer_operations
status: ACTIVE
boundary_tags: [now]
base_pattern: extract-candidates + missing-evidence
purpose: >
  Detect SLA and customer-obligation statements in approved documents
  that no internal procedure explains how to fulfill.
allowed_inputs:
  - approved contracts and SLA documents in scope (explicit
    obligation statements only - "shall", "must", "within N", named
    recurrence; the extract_obligations discipline)
  - the derived fulfillment questions, run through package consume()
question_frame:
  - "What is the approved procedure for producing the monthly customer
     service performance report?"
  - "Who is responsible for delivering the monthly service performance
     report, and by when?"
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - implied or inferred obligations
evidence_rules: >
  A finding requires: the obligation excerpt (asset id + quote,
  explicit statements only - never inferred) AND the reproducible
  refusal / absence of any covering approved procedure. Absence
  becomes a finding, never a fact. evidence_basis: REFUSAL_BACKED
  with the obligation excerpt cited.
allowed_finding_kinds: [SLA_OBLIGATION_GAP]
output_format: >
  One proposal document per finding to /08_proposals; body = the
  obligation (excerpt + source), the refused fulfillment question,
  proposed action (author the procedure; assign the owner at the
  human layer - owner assignment itself is Exception Stewardship
  territory and is not performed by this skill).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - the obligation is implied rather than explicit -> NEEDS_REVIEW
  - a covering approved procedure exists (no gap)
