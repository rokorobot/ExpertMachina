# CI (audit M0.1): the machine-enforced arm of the regression contract.
# Runs the verified-green suites - the HTTP smoke layer, the product
# regression suites, and the architectural seam suite (D18 boundary) -
# plus frontend type-check and lint. Suites not yet listed here are the
# triage backlog (notably test_conflict_engine.py, which downloads the
# ~1GB NLI model - candidate for a cached nightly job, not per-push CI).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      EM_NLI_VERIFICATION: "off"
      OPENAI_API_KEY: "mock-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: HTTP smoke layer
        working-directory: backend
        run: python test_http_api.py
      - name: Product regression suites
        working-directory: backend
        run: |
          python test_local_connector.py
          python test_sharepoint_provider.py
          python test_auto_approval.py
          python test_proposal_lane.py
          python test_derived_conflict_discipline.py
          python test_domain_classification.py
          python test_tier0_source_authority.py
          python test_tier2_engine_verification.py
          python test_automation_corpus.py
          python test_projection_engine.py
          python test_graph_renderer.py
          python test_mcp_graph_tools.py
          python test_projection_acceptance.py
          python test_revision_workflow.py
          python test_governance_inbox.py
          python test_llm_settings.py
          python test_package_consumer.py
          python test_package_evaluation.py
          python test_package_selection.py
          python test_expert_agent_binding.py
          python test_consumption_inbox.py
          python test_binding_lineage.py
          python test_identity_boundary.py
          python test_identity_tokens.py
          python test_mcp_gateway.py
          python test_authorization.py
          python test_migration.py
      - name: Architectural seam suite (D18 boundary)
        working-directory: backend
        run: python test_connector_seam.py
      - name: Workbench projection guard (D24 schema snapshot)
        working-directory: backend
        run: python test_workbench_projection.py
      - name: Credential custody guard (D25 sentinel sweep)
        working-directory: backend
        run: python test_credential_custody.py
      - name: Ingestion automation guard (D26 single approval path + revision sentinel)
        working-directory: backend
        run: python test_ingestion_automation_guard.py
      - name: Projection guard (D28 lens rule - no governed writes, renders never inputs)
        working-directory: backend
        run: python test_projection_guard.py
      - name: Agent authorship guard (D29/D30 one-way valve + derived source class)
        working-directory: backend
        run: python test_agent_authorship_guard.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The lockfile is generated by npm 11 (local dev). npm 10 (bundled
      # with Node 20) validates bundled deps of wasm optional packages
      # (@emnapi/* under tailwind oxide) differently and rejects the lock.
      # Pin CI to the npm major that owns the lockfile.
      - name: Align npm with the lockfile generator
        run: npm install -g npm@11
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint (errors fail; warnings reported)
        working-directory: frontend
        run: npx eslint src
