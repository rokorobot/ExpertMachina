; Test harness (audit 2026-07-07, task T0.1/T0.2 - docs/audit-2026-07-07.md).
;
; Collection is restricted to harness/: the historical suites
; (backend/test_*.py) each rebind the module-global db.engine at IMPORT
; time, so importing two of them into one interpreter cross-wires their
; databases. The harness runs each suite as an isolated subprocess -
; exactly the isolation CI always used - while pytest contributes what
; the hand-maintained CI list could not: automatic discovery (a new
; test_*.py can never be silently orphaned again), per-suite reporting,
; and failure aggregation.
[pytest]
testpaths = harness
addopts = -ra
