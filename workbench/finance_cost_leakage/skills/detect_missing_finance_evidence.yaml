skill_id: detect_missing_finance_evidence
workbench: finance_cost_leakage
status: ACTIVE
boundary_tags: [now]
base_pattern: missing-evidence
consolidates:
  # WS0 ruling 2: three registry #2 drafts are all "a governed finance
  # requirement calls for covering evidence the corpus cannot produce"
  # - the REFUSAL_BACKED pattern, over declared requirement classes.
  # Draft 5's document-bound half only (its operational half is [OE]).
  - identify_unused_service_obligations
  - detect_missing_spend_approval_evidence
  - identify_finance_policy_coverage_gaps
purpose: >
  Detect where an approved finance requirement (a spend-approval rule,
  a service-obligation the contract pays for, a policy area that
  should be covered) has NO approved covering evidence in the governed
  corpus - the evidence question is reproducibly refused. Absence is a
  finding, never a fact: this states the governed corpus does not
  DOCUMENT the evidence, never that the spend/approval did not
  actually happen (THE SETTLED ACCOUNT, refused - "did it happen?" is
  [OE]).
requirement_convention:
  requirement_classes: [spend_approval, service_obligation,
                        policy_coverage]
  # a finding requires (a) a verbatim requirement excerpt naming the
  # obligation/rule, and (b) a reproducible refusal - the packaged
  # answering contract returns INSUFFICIENT EVIDENCE for the declared
  # evidence question. A requirement the corpus DOES cover produces NO
  # finding (declared, a covered control).
  refusal_marker: "INSUFFICIENT EVIDENCE"
allowed_inputs:
  - the compiled expert package at binding clearance (approved finance
    requirements + the reproducible evidence-question refusals)
  - MCP get_domain_subgraph at the AGENT token's clearance
forbidden_inputs:
  - ungoverned sources; candidate/held content
  - invoices / POs / payments / bank / ERP / ledger / actual-spend
    records (until [OE]) - the "did the approval/spend happen?" half
    is exactly [OE]; THE INVOICE PLANT declined, naming [OE]
  - any claim about whether the missing evidence's underlying event
    occurred (THE SETTLED ACCOUNT)
  - other skills' pending (ungated) findings
evidence_rules: >
  A finding requires the verbatim requirement excerpt (asset id +
  quote) and the reproducible refusal of the declared evidence
  question. Never age, never inference. A covered requirement produces
  no finding. evidence_basis: REFUSAL_BACKED.
forbidden_vocabulary:
  - "was paid"
  - "was not approved"
  - "actually spent"
  - "invoice was processed"
allowed_finding_kinds: [MISSING_FINANCE_EVIDENCE]
output_format: >
  One proposal per finding to /08_proposals with the D30 + catalog
  frontmatter claims; body = the requirement excerpt (asset id +
  quote), the declared requirement_class, the reproducible refused
  question, proposed action (produce or ingest the covering evidence
  through the governed pipeline - the workbench never fabricates it).
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
audit_event: >
  MCP calls audited; scan/hold/gate events; approval quotes verified
  provenance verbatim.
refusal_conditions:
  - the corpus DOES cover the requirement -> no finding, declared
  - the requirement cannot be cited verbatim -> refuse (no invented
    requirement)
  - an "actual spend/approval happened?" question -> refuse, naming [OE]
question_frames:
  - "Which governed finance requirements have no approved covering evidence?"
