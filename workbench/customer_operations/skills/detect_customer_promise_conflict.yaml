skill_id: detect_customer_promise_conflict
workbench: customer_operations
status: ACTIVE
boundary_tags: [now]
base_pattern: contradictory-guidance
purpose: >
  Detect contradictions between customer-facing promises (sales
  materials, contracts, refund rules, SLA documents) and what internal
  support policies and procedures actually deliver.
allowed_inputs:
  - the compiled expert package at binding clearance
  - MCP get_domain_subgraph(customer_operations) and get_conflicts at
    the AGENT token's clearance
forbidden_inputs:
  - ungoverned sources; candidate/held content; transactional records
  - other skills' pending (ungated) findings
  - rendered vault notes as authority
evidence_rules: >
  A finding requires a governed CONFLICTS_WITH relationship
  (DIRECT_CONTRADICTION) between an approved customer-facing asset and
  an approved internal asset, cited with both asset ids and the
  promise excerpt. evidence_basis: CONFLICT_BACKED. Clearance
  exclusions declared.
allowed_finding_kinds: [CUSTOMER_PROMISE_CONFLICT]
output_format: >
  One proposal document per finding to /08_proposals with the D30 +
  catalog frontmatter claims; body = business statement, the two
  assets with excerpts, the governed conflict reference, proposed
  action.
human_approval_requirement: >
  The valve (D29): held CANDIDATE until a human accepts as DERIVED.
  Never auto-approved.
audit_event: >
  MCP calls audited per call; scan/hold/gate events are the trail;
  approval quotes verified provenance verbatim.
refusal_conditions:
  - no governed conflict relationship exists (suspected misalignment
    without one is deferred detect_process_inconsistency territory)
  - evidence cannot be cited with governed asset ids
